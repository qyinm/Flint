schema_version: 1
id: "bug-debugger"
name: "Bug Debugger"
description: "Diagnose a bug from symptoms, logs, and code context before proposing fixes."
triggers:
  typed: [":debug"]
  spoken: ["debug prompt"]
variables:
  symptom:
    default: "the observed failure"
  constraint:
    default: "prefer the smallest verifiable fix"
targets:
  generic: |
    Diagnose this bug: {{symptom}}.
